[client]
showErrorDetails = false
toolbarMode = "minimal"
showSidebarNavigation = true

[server]
port = 8506
headless = true
runOnSave = false
enableCORS = true
enableXsrfProtection = false
maxUploadSize = 200

[logger]
level = "info"

[theme]
primaryColor = "#0066cc"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f8fafc"
textColor = "#1f2937"
font = "sans serif"
