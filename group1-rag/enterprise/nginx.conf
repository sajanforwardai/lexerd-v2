# Nginx Configuration for Group One Trading RAG Enterprise Load Balancing

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 10000;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ============================================================================
    # LOGGING
    # ============================================================================

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    log_format json escape=json
    '{'
        '"timestamp":"$time_iso8601",'
        '"client_ip":"$remote_addr",'
        '"request":"$request",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":$status,'
        '"bytes_sent":$bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_response_time":"$upstream_response_time",'
        '"user_agent":"$http_user_agent"'
    '}';

    access_log /var/log/nginx/access.log json;

    # ============================================================================
    # PERFORMANCE OPTIMIZATION
    # ============================================================================

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 10M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss
               application/rss+xml font/truetype font/opentype
               application/vnd.ms-fontobject image/svg+xml;

    # ============================================================================
    # RATE LIMITING
    # ============================================================================

    # 100 requests per second per IP
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;
    limit_req_zone $http_x_forwarded_for zone=user_limit:10m rate=100r/s;

    # ============================================================================
    # UPSTREAM SERVERS (API INSTANCES)
    # ============================================================================

    upstream rag_api {
        # Round-robin load balancing
        server api-1:8000 weight=1;
        server api-2:8000 weight=1;
        server api-3:8000 weight=1 backup;

        # Health checks
        keepalive 32;
        keepalive_requests 100;
        keepalive_timeout 60s;
    }

    upstream rag_prometheus {
        server prometheus:9090;
    }

    upstream rag_grafana {
        server grafana:3000;
    }

    upstream rag_jaeger {
        server jaeger:16686;
    }

    # ============================================================================
    # CACHING
    # ============================================================================

    proxy_cache_path /var/cache/nginx/api levels=1:2 keys_zone=api_cache:10m
                     max_size=1g inactive=60m;
    proxy_cache_path /var/cache/nginx/static levels=1:2 keys_zone=static_cache:10m
                     max_size=100m inactive=30d;

    # ============================================================================
    # SECURITY HEADERS
    # ============================================================================

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;

    # ============================================================================
    # API SERVER (MAIN)
    # ============================================================================

    server {
        listen 80;
        server_name _;

        # Rate limiting
        limit_req zone=api_limit burst=20 nodelay;
        limit_req zone=user_limit burst=20 nodelay;

        location /health {
            access_log off;
            proxy_pass http://rag_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_connect_timeout 5s;
            proxy_read_timeout 5s;
        }

        location /ready {
            access_log off;
            proxy_pass http://rag_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_connect_timeout 5s;
            proxy_read_timeout 5s;
        }

        location /metrics {
            # Metrics endpoint - restrict access in production
            proxy_pass http://rag_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # Cache metrics for 10 seconds
            proxy_cache api_cache;
            proxy_cache_valid 200 10s;
        }

        location /api/v1/ {
            # API proxy
            proxy_pass http://rag_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;

            # Timeouts
            proxy_connect_timeout 30s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # Buffering
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
            proxy_busy_buffers_size 8k;

            # Error handling
            proxy_next_upstream error timeout invalid_header http_502 http_503;
            proxy_next_upstream_tries 2;
            proxy_next_upstream_timeout 10s;
        }

        # Catch-all for non-API requests
        location / {
            proxy_pass http://rag_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }

    # ============================================================================
    # MONITORING DASHBOARDS
    # ============================================================================

    server {
        listen 80;
        server_name monitoring.local;

        location /prometheus/ {
            proxy_pass http://rag_prometheus/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location /grafana/ {
            proxy_pass http://rag_grafana/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location /jaeger/ {
            proxy_pass http://rag_jaeger/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }
    }

    # ============================================================================
    # HTTPS (requires SSL certificates)
    # ============================================================================

    # Uncomment and configure for HTTPS
    # server {
    #     listen 443 ssl http2;
    #     server_name api.example.com;
    #
    #     ssl_certificate /etc/nginx/ssl/cert.pem;
    #     ssl_certificate_key /etc/nginx/ssl/key.pem;
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_ciphers HIGH:!aNULL:!MD5;
    #     ssl_prefer_server_ciphers on;
    #
    #     # HSTS
    #     add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    #
    #     # Same location blocks as above
    # }

    # HTTP to HTTPS redirect
    # server {
    #     listen 80;
    #     server_name api.example.com;
    #     return 301 https://$server_name$request_uri;
    # }
}
