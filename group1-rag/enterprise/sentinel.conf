# Redis Sentinel Configuration for High Availability
# Automatic failover for Redis cache

port 26379

# Monitor Redis primary on port 6379
# Format: sentinel monitor <master-name> <ip> <port> <quorum>
sentinel monitor mymaster redis 6379 1

# Milliseconds between checks
sentinel down-after-milliseconds mymaster 5000

# Milliseconds to wait before declaring failover as failed
sentinel failover-timeout mymaster 10000

# Number of replicas to reconfigure in parallel during failover
sentinel parallel-syncs mymaster 1

# Notification script (optional)
# sentinel notification-script mymaster /path/to/notification.sh

# Client reconfiguration script (optional)
# sentinel client-reconfig-script mymaster /path/to/reconfig.sh

# Logging
loglevel notice
logfile "/var/log/redis/sentinel.log"

# Data directory
dir /data

# Daemonize
daemonize no

# Bind to all interfaces
bind 0.0.0.0
