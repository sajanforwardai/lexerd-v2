[pytest]
# Pytest configuration for Group One RAG testing framework

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Minimum Python version
minversion = 3.8

# Output and logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

log_file = results/pytest.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)8s] [%(filename)s:%(lineno)d] %(funcName)s - %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# Markers for test categorization
markers =
    tier1: Tier 1 retrieval evaluation tests
    tier2: Tier 2 entity extraction tests
    e2e: End-to-end pipeline tests
    regression: Regression and benchmark tests
    slow: Slow tests (can be skipped with -m "not slow")
    benchmark: Benchmark validation tests

# Reporting
addopts =
    --verbose
    --strict-markers
    --tb=short
    --capture=no
    -ra
    --color=yes

# Coverage options (if pytest-cov installed)
# addopts = --cov=. --cov-report=html --cov-report=term-missing

# Timeout for tests (requires pytest-timeout)
# timeout = 600

# Test paths
testpaths = .

# Ignore patterns
norecursedirs = .git .venv __pycache__ *.egg-info .pytest_cache results .swarm

# NumPy and other warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
